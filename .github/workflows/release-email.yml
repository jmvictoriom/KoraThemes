name: Release email

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/release-email.yml
      - scripts/**
      - tests/**
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Published version to notify again (for example v1.0.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-email-${{ github.event.release.tag_name || inputs.tag || github.sha }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          persist-credentials: false
      - run: python3 -m unittest discover -s tests -v

  notify:
    if: github.event_name != 'push'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          persist-credentials: false
      - name: Send the version URL, downloads and changelog
        run: python3 scripts/notify_release.py
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_EMAIL_TO: ${{ vars.RELEASE_EMAIL_TO }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT || '587' }}
          SMTP_SECURITY: ${{ vars.SMTP_SECURITY || 'starttls' }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
