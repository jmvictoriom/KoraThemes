name: Release email

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/*.yml
      - scripts/**
      - tests/**
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Published version to notify again (for example v1.0.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-email-${{ github.event.release.tag_name || inputs.tag || github.sha }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          persist-credentials: false
      - run: python3 -m unittest discover -s tests -v

  notify:
    if: github.event_name != 'push'
    needs: test
    uses: ./.github/workflows/send-release-email.yml
    with:
      tag: ${{ inputs.tag || '' }}
    secrets:
      recipient_settings: ${{ toJSON(vars) }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      SMTP_FROM: ${{ secrets.SMTP_FROM }}
